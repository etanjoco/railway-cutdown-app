<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Players</title>
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <style>
      body { font-family: Arial, Helvetica, sans-serif; margin: 20px; }
      table { border-collapse: collapse; width: 100%; margin-top: 12px; }
      th, td { border: 1px solid #ddd; padding: 8px; }
      th { background: #f5f5f5; }
      tr:nth-child(even) { background: #fafafa; }
      .controls { margin-bottom: 8px; }
    </style>
  </head>
  <body>
    <h1>Players</h1>
    <div class="controls">
      <button id="reload">Reload</button>
    </div>

    <table id="players-table">
      <thead>
        <tr>
          <th>ID</th>
          <th>Name</th>
          <th>Grade</th>
          <th>Bib</th>
          <th>Score Tech</th>
          <th>Score Phys</th>
          <th>Notes</th>
        </tr>
      </thead>
      <tbody>
      </tbody>
    </table>

    <script>
      async function loadPlayers() {
        const res = await fetch('/players');
        const tbody = document.querySelector('#players-table tbody');
        if (!res.ok) {
          tbody.innerHTML = '<tr><td colspan="7">Failed to load players</td></tr>';
          return;
        }
        const data = await res.json();
        tbody.innerHTML = '';
        if (!Array.isArray(data) || data.length === 0) {
          tbody.innerHTML = '<tr><td colspan="7">No players</td></tr>';
          return;
        }

        const cols = ['id','name','grade','bib_number','score_tech','score_phys','notes'];
        data.forEach(p => {
          const tr = document.createElement('tr');
          cols.forEach(k => {
            const td = document.createElement('td');
            td.textContent = (p[k] !== null && p[k] !== undefined) ? p[k] : '';
            tr.appendChild(td);
          });
          tbody.appendChild(tr);
        });
      }

      document.getElementById('reload').addEventListener('click', loadPlayers);
      loadPlayers();
    </script>
  </body>
</html>
